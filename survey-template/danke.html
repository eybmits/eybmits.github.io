<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vielen Dank</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(560px,calc(100% - 32px));padding:46px 38px;text-align:center;background:#fff;border:1px solid #e3e8f0;border-radius:18px;box-shadow:0 18px 55px #17203317}.icon{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 18px;border-radius:50%;background:#ecfdf3;color:#166534;font-size:30px;font-weight:800}h1{margin:0 0 8px}p{margin:0;color:#667085}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <h1>Vielen Dank für dein Feedback!</h1>
    <p>Deine Antwort wurde erfolgreich übermittelt.</p>
  </main>
</body>
</html>
