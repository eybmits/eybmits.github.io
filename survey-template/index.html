<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kurzfeedback</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(850px,calc(100% - 24px));margin:32px auto 60px;background:#fff;border:1px solid #e3e8f0;border-radius:18px;box-shadow:0 18px 55px #17203317;overflow:hidden}header{padding:38px 42px 30px;border-bottom:1px solid #e3e8f0}h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.15;margin:0 0 10px}header p{color:#667085}.meta{display:flex;gap:18px;flex-wrap:wrap;color:#667085;font-size:.9rem}.meta span:before{content:'✓ ';color:#2457d6;font-weight:800}form{padding:4px 42px 38px}fieldset{border:0;border-bottom:1px solid #e3e8f0;padding:27px 0;margin:0}legend{font-weight:700;width:100%}legend b{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:10px;border-radius:9px;background:#eef3ff;color:#2457d6;font-size:.85rem}.scale{display:grid;grid-template-columns:minmax(110px,1fr) repeat(5,48px) minmax(110px,1fr);gap:8px;align-items:center;margin-top:18px}.scale small:last-child{text-align:right}label{display:grid;place-items:center;cursor:pointer}input[type=radio]{position:absolute;opacity:0}label span{display:grid;place-items:center;width:40px;height:40px;border:1.5px solid #bdc7d5;border-radius:50%;font-weight:700}input:checked+span{background:#2457d6;border-color:#2457d6;color:#fff}textarea{width:100%;min-height:120px;margin-top:15px;padding:14px;border:1.5px solid #cfd7e3;border-radius:12px;font:inherit;resize:vertical}button{display:block;margin:28px 0 0 auto;border:0;border-radius:11px;padding:13px 22px;background:#2457d6;color:#fff;font:inherit;font-weight:750;cursor:pointer}@media(max-width:680px){main{margin-top:10px}header,form{padding-left:20px;padding-right:20px}.scale{grid-template-columns:repeat(5,1fr)}.scale small{grid-column:1/-1;text-align:left!important}}
  </style>
  <script src="config.js"></script>
</head>
<body>
  <main>
    <header>
      <h1 id="title"></h1>
      <p id="intro"></p>
      <div class="meta"><span id="duration"></span><span id="count"></span></div>
    </header>
    <form id="survey"></form>
  </main>
  <script>
    const c = window.SURVEY_CONFIG;
    document.title = c.title;
    document.getElementById('title').textContent = c.title;
    document.getElementById('intro').textContent = c.intro;
    document.getElementById('duration').textContent = c.duration;
    document.getElementById('count').textContent = `${c.questions.length} Fragen`;

    const form = document.getElementById('survey');
    form.action = `https://formsubmit.co/${c.recipientEmail}`;
    form.method = 'POST';
    form.innerHTML = `
      <input type="hidden" name="_subject" value="${c.emailSubject}">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="${location.origin}${location.pathname.replace(/index\.html$/, '').replace(/\/$/, '')}/danke.html">
      <input type="text" name="_honey" style="display:none">
    `;

    c.questions.forEach((q, i) => {
      const fieldset = document.createElement('fieldset');
      const legend = document.createElement('legend');
      legend.innerHTML = `<b>${i + 1}</b>${q.text}${q.required ? '' : ' <small>(optional)</small>'}`;
      fieldset.appendChild(legend);

      if (q.type === 'scale') {
        const scale = document.createElement('div');
        scale.className = 'scale';
        scale.innerHTML = `<small>${c.scaleLeft}</small>` +
          [1,2,3,4,5].map(v => `<label><input type="radio" name="q${i + 1}" value="${v}" ${q.required ? 'required' : ''}><span>${v}</span></label>`).join('') +
          `<small>${c.scaleRight}</small>`;
        fieldset.appendChild(scale);
      } else {
        const textarea = document.createElement('textarea');
        textarea.name = `q${i + 1}`;
        textarea.maxLength = 1500;
        textarea.placeholder = q.placeholder || '';
        if (q.required) textarea.required = true;
        fieldset.appendChild(textarea);
      }
      form.appendChild(fieldset);
    });

    const button = document.createElement('button');
    button.type = 'submit';
    button.textContent = 'Feedback absenden';
    form.appendChild(button);
  </script>
</body>
</html>
